# One Worker serves the whole site: static files from dist/ plus the contact
# API at /api/contact (see worker/contact.ts). There is no separate Pages
# project — `wrangler deploy` publishes both in one go.
name = "mysite"
main = "worker/contact.ts"
compatibility_date = "2026-01-01"

[assets]
directory = "./dist"

# Rate limiting state. Create it once, then put the real id here:
#   npx wrangler kv namespace create RATE_LIMITER
[[kv_namespaces]]
binding = "RATE_LIMITER"
id = "aee4cb950b0a4cf680c9c3b3842d3e10"

[vars]
# The exact origin the site is served from. Requests from anywhere else are
# rejected before any work is done. Must match the deployed hostname.
ALLOWED_ORIGIN = "https://rafifhardja.xyz"

TO_EMAIL = "you@email.com"
FROM_EMAIL = "Portfolio <hello@yourdomain.com>"

# Secrets — never in this file. Dashboard → Worker → Settings → Variables,
# or CLI from a logged-in shell:
#   npx wrangler secret put RESEND_API_KEY
#   npx wrangler secret put TURNSTILE_SECRET
