name = "portfolio-contact"
main = "worker/contact.ts"
compatibility_date = "2026-01-01"

# Rate limiting state. Create: wrangler kv namespace create RATE_LIMITER
[[kv_namespaces]]
binding = "RATE_LIMITER"
id = "<kv-namespace-id>"

[vars]
# The exact origin the site is served from. Requests from anywhere else are
# rejected before any work is done.
ALLOWED_ORIGIN = "https://yourdomain.com"

TO_EMAIL = "you@email.com"
FROM_EMAIL = "Portfolio <hello@yourdomain.com>"

# Secrets — never in this file:
#   wrangler secret put RESEND_API_KEY
#   wrangler secret put TURNSTILE_SECRET